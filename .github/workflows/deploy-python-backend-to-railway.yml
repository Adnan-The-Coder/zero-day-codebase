# .github/workflows/deploy-railway.yml
name: 🚂 Deploy to Railway

on:
  push:
    branches: 
      - main
      - production
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  WORKING_DIRECTORY: apps/python-backend

jobs:
  # Build and Test Job
  test:
    name: 🧪 Test & Build
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.changes.outputs.backend }}
      
    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🔍 Check for backend changes
      uses: dorny/paths-filter@v2
      id: changes
      with:
        filters: |
          backend:
            - 'apps/python-backend/**'

    - name: 🐍 Set up Python
      if: steps.changes.outputs.backend == 'true'
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📦 Install dependencies
      if: steps.changes.outputs.backend == 'true'
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest flake8

    - name: 🔍 Lint with flake8
      if: steps.changes.outputs.backend == 'true'
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        flake8 app/ main.py --count --select=E9,F63,F7,F82 --ignore=F824 --show-source --statistics
        flake8 app/ main.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: 🐳 Test Docker build
      if: steps.changes.outputs.backend == 'true'
      working-directory: ${{ env.WORKING_DIRECTORY }}
      run: |
        docker build -t ml-backend:test .
        echo "✅ Docker build successful"
  
  # Deploy to Railway
  deploy:
    name: 🚀 Deploy to Railway
    runs-on: ubuntu-latest
    needs: test
    if: needs.test.outputs.should-deploy == 'true'
    environment: 
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🛤️ Install Railway CLI
      run: |
        npm install -g @railway/cli
        railway --version

    - name: 🔐 Configure Railway Authentication
      run: |
        echo "✅ Using Railway API Token"
      env:
        RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

    - name: 🔗 Link Railway Project
      working-directory: ${{ env.WORKING_DIRECTORY }}
      env:
        RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        if [ -n "${{ secrets.RAILWAY_PROJECT_ID }}" ]; then
          railway link --project ${{ secrets.RAILWAY_PROJECT_ID }} --yes
          echo "✅ Linked to project: ${{ secrets.RAILWAY_PROJECT_ID }}"
        else
          echo "ℹ️ No PROJECT_ID provided, falling back to railway.json"
        fi

    - name: 🚀 Deploy to Railway
      id: deploy
      working-directory: ${{ env.WORKING_DIRECTORY }}
      env:
        RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      run: |
        echo "🚀 Starting Railway deployment..."

        # Set environment variables if provided
        if [ -n "${{ secrets.RAILWAY_ENVIRONMENT_VARS }}" ]; then
          echo '${{ secrets.RAILWAY_ENVIRONMENT_VARS }}' | railway variables import --json
        fi

        # Deploy the application
        railway up --yes --detach

        # Get deployment URL
        RAILWAY_URL=$(railway status --json | jq -r '.deployments[0].url // "https://your-app.railway.app"')
        echo "url=$RAILWAY_URL" >> $GITHUB_OUTPUT
        echo "✅ Deployment completed!"
        echo "🌐 App URL: $RAILWAY_URL"

    - name: 🏥 Health Check
      id: health-check
      run: |
        echo "🏥 Performing health check..."
        URL="${{ steps.deploy.outputs.url }}"
        sleep 60
        
        for i in {1..10}; do
          echo "🔍 Health check attempt $i/10..."
          if curl -f --connect-timeout 10 --max-time 30 "$URL/health"; then
            echo "✅ Health check passed!"
            if curl -f -X POST "$URL/api/v1/spam/classify" \
              -H "Content-Type: application/json" \
              -d '{"text":"test message"}'; then
              echo "✅ API endpoint test passed!"
            fi
            break
          else
            echo "❌ Health check failed, retrying in 30s..."
            if [ $i -eq 10 ]; then
              echo "❌ Health check failed after 10 attempts"
              exit 1
            fi
            sleep 30
          fi
        done

    - name: 📊 Deployment Summary
      run: |
        echo "## 🚀 Railway Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| 🌐 **URL** | ${{ steps.deploy.outputs.url }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 🏷️ **Environment** | ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| 📝 **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| 👤 **Deployed by** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
        echo "| ⏰ **Deploy Time** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

  # Notify on failure
  notify-failure:
    name: 📢 Notify on Failure
    runs-on: ubuntu-latest
    needs: [test, deploy]
    if: failure()
    steps:
    - name: 📢 Deployment Failed
      run: |
        echo "## ❌ Railway Deployment Failed" >> $GITHUB_STEP_SUMMARY
        echo "Check logs above." >> $GITHUB_STEP_SUMMARY
        echo "- Ensure \`RAILWAY_TOKEN\` secret is valid" >> $GITHUB_STEP_SUMMARY
        echo "- Ensure \`RAILWAY_PROJECT_ID\` is correct" >> $GITHUB_STEP_SUMMARY
        echo "- App startup issues (missing model, crash, etc.)" >> $GITHUB_STEP_SUMMARY
